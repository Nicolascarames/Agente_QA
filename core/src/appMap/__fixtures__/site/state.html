<!doctype html>
<html lang="en">
  <!-- Deliberately linked from nowhere: the state tests crawl it directly as
       their own base URL, so it costs the full-crawl suites nothing and the
       screen count is unambiguous.

       The primary target class of this whole tool: a click that swaps the panel
       and leaves `page.url()` IDENTICAL. Measured on a real application, whose
       "Forgot password?" does exactly this — the walk recorded a transition
       only when the URL changed, so the crawl found one screen and stopped,
       with nothing about the view the click reveals. -->
  <head><meta charset="utf-8" /><title>Fixture · Client-rendered state</title></head>
  <body>
    <main>
      <h1>Sign in</h1>
      <div id="panel"><p>Enter your credentials to continue.</p></div>
      <!-- Both buttons swap in the SAME panel: two ways into one state. The
           second must NOT add a second state — a signature already recorded for
           this screen is not recorded twice, or a toggle would grow one state
           per click. Both sit outside the panel so the swap does not remove
           them. -->
      <button type="button" id="forgot">Forgot password?</button>
      <button type="button" id="forgot-again">Reset my password</button>
    </main>
    <script>
      const swap = () => {
        document.getElementById("panel").innerHTML =
          '<p>We will email you a reset link.</p><button type="button">Send reset link</button>';
      };
      document.getElementById("forgot").addEventListener("click", swap);
      document.getElementById("forgot-again").addEventListener("click", swap);
    </script>
  </body>
</html>
