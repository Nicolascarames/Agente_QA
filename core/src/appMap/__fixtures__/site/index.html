<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Fixture · Log in</title></head>
  <body>
    <header>
      <button type="button">Log in</button>
      <!-- Same name as the link inside <main> below, pointing at a DIFFERENT
           destination: the fixture's case for a region-disambiguated click.
           DOM order puts this one first, so a click loop that re-resolves
           the name unscoped and takes `.first()` lands here instead of on
           the element `resolveCandidate` actually validated and recorded. -->
      <a href="/reset.html">Help</a>
    </header>
    <main>
      <h1>Welcome back</h1>
      <form id="login">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" />
        <button type="submit">Log in</button>
      </form>
      <a href="/reset.html">Forgot password?</a>
      <a href="/list.html">Orders</a>
      <a href="/list.html">Help</a>
      <!-- /order-history.html and /order/history.html both normalize to the
           same pythonIdentifier ("order_history_html"): the fixture's
           screen-id collision case. -->
      <a href="/order-history.html">Order history (dash)</a>
      <a href="/order/history.html">Order history (slash)</a>
      <p id="error" hidden>Authentication failed. Please try again.</p>
      <!-- Duplicate of the field label, in a <p> and outside any single region:
           no region scoping brings it down to one match, so it is the fixture's
           irreducibly ambiguous case. -->
      <aside><p>Email</p></aside>
    </main>
    <!-- Second decoy, same name as the form's submit button, placed AFTER the
         form in DOM order — the opposite of the header decoy above. Proves
         the write pass cannot rely on DOM position at all: a `.last()` click
         would land HERE instead of on the real submit button, so the real
         submit never fires. The write pass must resolve the submit button
         through its own `disambiguatedBy` region scope (region:main), which
         stays correct regardless of where this decoy sits in the DOM. -->
    <button type="button">Log in</button>
    <script>
      document.getElementById("login").addEventListener("submit", (event) => {
        event.preventDefault();
        const ok = document.getElementById("email").value === "user@example.test"
          && document.getElementById("password").value === "s3cr3t-pass";
        if (ok) { window.location.href = "/dashboard.html"; return; }
        document.getElementById("error").hidden = false;
      });
    </script>
  </body>
</html>
