name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC trusted publishing: npm exchanges this token for a short-lived
      # publish credential, no NPM_TOKEN secret needed. Configure the
      # "Trusted Publisher" for each package on npmjs.com to point at this
      # repo + workflow file first.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (trusted publishing needs npm >=11.5.1)
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish @agente-qa/core
        run: npm publish --workspace core --access public

      - name: Publish agente-qa
        run: npm publish --workspace cli --access public
